name: train-model
on:
  workflow_dispatch:
    inputs:
      task:
        description: Classification task
        required: true
        default: binary
        type: choice
        options: [binary, multiclass]
      smoke:
        description: Use tiny debug dataset (pipeline test only)
        required: true
        default: true
        type: boolean
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -r training/requirements.txt
      - name: Train and export INT8 TFLite
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ inputs.smoke }}" == "true" ]]; then EXTRA="--smoke"; fi
          python training/train_tf_mobilenetv2.py --task "${{ inputs.task }}" $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: agrivision-model-${{ inputs.task }}
          path: training/output/agrivision-mobilenetv2/
          if-no-files-found: error
