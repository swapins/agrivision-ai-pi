name: train-and-publish-huggingface

on:
  workflow_dispatch:
    inputs:
      task:
        description: Classification task
        required: true
        default: binary
        type: choice
        options: [binary, multiclass]
      smoke:
        description: Debug pipeline only; never publishes
        required: true
        default: true
        type: boolean

jobs:
  train-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      HF_REPO_ID: peachbotAI/agrivision-mobilenetv2-edge-tpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install -U pip
          pip install -r training/requirements.txt

      - name: Smoke train and export INT8
        if: ${{ inputs.smoke }}
        run: |
          python training/train_tf_mobilenetv2.py \
            --task "${{ inputs.task }}" \
            --init scratch \
            --smoke

      - name: Full official PeachBot train and school-project release gate
        if: ${{ !inputs.smoke }}
        run: |
          # The tiny balanced overfit check is intentionally skipped for release runs.
          # MobileNetV2 BatchNorm statistics are not reliable on that miniature subset;
          # the real held-out FLOAT/INT8 evaluation below is the release authority.
          python training/train_tf_mobilenetv2.py \
            --task binary \
            --init scratch \
            --require-official-lineage \
            --skip-sanity-check \
            --min-int8-accuracy 0.80 \
            --min-int8-balanced-accuracy 0.75 \
            --min-int8-macro-f1 0.75 \
            --require-all-classes-predicted

      - name: Upload training artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: agrivision-model-${{ inputs.task }}-${{ inputs.smoke && 'smoke' || 'release' }}
          path: training/output/agrivision-mobilenetv2/
          if-no-files-found: error

      - name: Stop smoke model before publication
        if: ${{ inputs.smoke }}
        run: |
          echo "Smoke training completed. Tiny-dataset artifacts are debug-only and are not published to Hugging Face."

      - name: Exchange GitHub OIDC identity for short-lived Hugging Face token
        if: ${{ !inputs.smoke }}
        env:
          HF_OIDC_RESOURCE: peachbotAI/agrivision-mobilenetv2-edge-tpu
        run: |
          echo "HF_TOKEN=$(hf auth token)" >> "$GITHUB_ENV"

      - name: Publish verified school-project release to PeachBot AI on Hugging Face
        if: ${{ !inputs.smoke }}
        run: |
          python training/publish_hf.py \
            --repo-id "$HF_REPO_ID" \
            --require-official-lineage \
            --min-int8-accuracy 0.80 \
            --min-int8-balanced-accuracy 0.75 \
            --min-int8-macro-f1 0.75 \
            --require-all-classes-predicted
