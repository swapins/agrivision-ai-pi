name: train-and-publish-huggingface

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: Hugging Face model repo, e.g. username/agrivision-mobilenetv2-edge-tpu
        required: true
        type: string
      task:
        description: Classification task
        required: true
        default: binary
        type: choice
        options: [binary, multiclass]
      smoke:
        description: Debug pipeline only (tiny dataset; never a final release)
        required: true
        default: true
        type: boolean

jobs:
  train-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Verify Hugging Face secret
        shell: bash
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN secret is not configured." >&2
            exit 2
          fi
      - run: python -m pip install -U pip
      - run: pip install -r training/requirements.txt
      - name: Train and export full-integer INT8 TFLite
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ inputs.smoke }}" == "true" ]]; then EXTRA="--smoke"; fi
          python training/train_tf_mobilenetv2.py --task "${{ inputs.task }}" $EXTRA
      - name: Block debug model from public-style final release
        if: ${{ inputs.smoke }}
        run: |
          echo "Smoke run completed. Publishing is intentionally skipped because the tiny dataset is debug-only."
      - name: Publish full model to Hugging Face
        if: ${{ !inputs.smoke }}
        run: |
          python training/publish_hf.py --repo-id "${{ inputs.hf_repo_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: agrivision-model-${{ inputs.task }}
          path: training/output/agrivision-mobilenetv2/
          if-no-files-found: error
