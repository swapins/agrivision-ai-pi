name: full-model-training

on:
  push:
    branches:
      - main
      - fix/model-collapse-diagnostics
    paths:
      - 'training/train_tf_mobilenetv2.py'
      - 'training/requirements.txt'
      - '.github/workflows/full-train.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install -U pip
          pip install -r training/requirements.txt

      - name: Full official PeachBot training with collapse safeguards
        run: |
          python training/train_tf_mobilenetv2.py \
            --task binary \
            --init scratch \
            --require-official-lineage \
            --min-int8-accuracy 0.90 \
            --min-int8-balanced-accuracy 0.85 \
            --min-int8-macro-f1 0.85 \
            --require-all-classes-predicted

      - name: Upload full training artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agrivision-full-training-${{ github.run_id }}
          path: training/output/agrivision-mobilenetv2/
          if-no-files-found: warn
          retention-days: 14
