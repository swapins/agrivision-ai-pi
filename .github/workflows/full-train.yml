name: full-model-training

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install -U pip
          pip install -r training/requirements.txt

      - name: Full official PeachBot training with school-project quality gates
        run: |
          # The miniature overfit test is skipped here because MobileNetV2 BatchNorm
          # statistics on only 64 samples are not representative of full inference.
          # Release decisions are based on the real held-out FLOAT and INT8 tests.
          python training/train_tf_mobilenetv2.py \
            --task binary \
            --init scratch \
            --require-official-lineage \
            --skip-sanity-check \
            --min-int8-accuracy 0.80 \
            --min-int8-balanced-accuracy 0.75 \
            --min-int8-macro-f1 0.75 \
            --require-all-classes-predicted

      - name: Upload full training artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agrivision-full-training-${{ github.run_id }}
          path: training/output/agrivision-mobilenetv2/
          if-no-files-found: warn
          retention-days: 14
