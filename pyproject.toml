[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrivision-ai"
version = "1.0.0"
description = "Raspberry Pi + Coral Edge TPU smart agriculture school project"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Isis Saritha Swapin"},
  {name = "PeachBot"}
]
dependencies = [
  "Flask>=2.2,<4",
  "PyYAML>=6,<7",
  "Pillow>=9,<12"
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrivision = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
